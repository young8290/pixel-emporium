<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F3E7C9;padding:24px 8px"><tr><td align="center"><table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:100%;max-width:600px;background:#FCF5E0;border:4px solid #6E4423;box-shadow:6px 6px 0 #A2652F"><tr><td th:replace="~{mail/_layout :: brand}"></td></tr><tr><td style="padding:12px 24px 24px;font:14px Arial,sans-serif;color:#3B2A1A"><p>订单号：<b th:text="${event.orderNo}"></b></p><p>下单时间：<span th:text="${event.createdAt}"></span></p><table role="presentation" width="100%" cellspacing="0" cellpadding="6" style="border-top:2px solid #A2652F"><tr th:each="item : ${items}"><td width="112" align="center" valign="middle"><img th:if="${item.image != null}" th:src="${item.image}" th:alt="${item.productTitle}" width="96" style="display:block;max-width:96px;height:auto;object-fit:contain"></td><td><b th:text="${item.productTitle}"></b><br><span th:text="${item.skuTitle}"></span> 单价：<span th:text="${item.price}"></span> 数量：<span th:text="${item.quantity}"></span> 小计：<span th:text="${item.subtotal}"></span></td></tr></table><p>总额：<span th:text="${total}"></span> 运费：<span th:text="${freight}"></span> 应付：<span th:text="${pay}"></span></p><p>收货信息：<span th:text="${event.receiver.name}"></span> <span th:text="${event.receiver.phone}"></span> <span th:text="${event.receiver.province}"></span><span th:text="${event.receiver.city}"></span><span th:text="${event.receiver.district}"></span><span th:text="${event.receiver.detail}"></span></p><p><a th:href="${orderUrl}">查看订单详情</a></p></td></tr><tr><td th:replace="~{mail/_layout :: footer}"></td></tr></table></td></tr></table></body></html>
