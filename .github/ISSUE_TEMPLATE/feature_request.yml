name: ✨ 功能建议
description: 提出新功能或改进想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前有什么不方便或缺失的地方？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？如涉及界面，可附上草图或像素素材设想。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他备选方案
